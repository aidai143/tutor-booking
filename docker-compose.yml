services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tutor_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # 127.0.0.1 — the database is reachable only from this computer, not from the network
      - "127.0.0.1:5432:5432"
    volumes:
      # data lives in a named volume, so it survives container restarts
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d tutor_db"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      # inside Docker the database is reached by its service name "db", not localhost
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
