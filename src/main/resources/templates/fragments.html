<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Учебный центр'">Учебный центр</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<aside th:fragment="side(active)" class="side">
    <a class="brand" th:href="@{/lessons}">
        <span class="brand-mark" aria-hidden="true">УЦ</span>
        <span>Учебный центр</span>
    </a>
    <nav class="menu" aria-label="Разделы">
        <a class="menu-item" th:href="@{/lessons}" th:classappend="${active == 'lessons'} ? 'is-active'">
            Занятия <span class="count" th:text="${navCounts['lessons']}"></span></a>
        <a class="menu-item" th:href="@{/students}" th:classappend="${active == 'students'} ? 'is-active'">
            Ученики <span class="count" th:text="${navCounts['students']}"></span></a>
        <a class="menu-item" th:href="@{/tutors}" th:classappend="${active == 'tutors'} ? 'is-active'">
            Репетиторы <span class="count" th:text="${navCounts['tutors']}"></span></a>
        <a class="menu-item" th:href="@{/subjects}" th:classappend="${active == 'subjects'} ? 'is-active'">
            Предметы <span class="count" th:text="${navCounts['subjects']}"></span></a>
        <a class="menu-item" th:href="@{/report}" th:classappend="${active == 'report'} ? 'is-active'">Отчёт</a>
    </nav>
    <p class="side-foot">Панель администратора. Занятия без накладок, отчёт для расчёта с репетиторами.</p>
</aside>

<div th:fragment="messages">
    <p class="msg msg-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <p class="msg msg-success" role="status" th:if="${success}" th:text="${success}"></p>
</div>

<!-- Icon: Lucide "search", lucide-static v0.469.0, ISC license (https://lucide.dev) -->
<svg th:fragment="icon-search" class="icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.3-4.3"/>
</svg>

</body>
</html>
