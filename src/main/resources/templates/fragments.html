<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Учебный центр'">Учебный центр</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<aside th:fragment="side(active)" class="side">
    <a class="brand" th:href="@{/lessons}">
        <span class="brand-mark"><svg th:replace="~{fragments :: icon('graduation-cap')}"></svg></span>
        <span>Учебный центр<small>расписание занятий</small></span>
    </a>
    <nav class="menu" aria-label="Разделы">
        <a class="menu-item" th:href="@{/lessons}" th:classappend="${active == 'lessons'} ? 'is-active'">
            <svg th:replace="~{fragments :: icon('calendar-days')}"></svg>
            <span class="menu-label">Занятия</span><span class="count" th:text="${navCounts['lessons']}"></span></a>
        <a class="menu-item" th:href="@{/students}" th:classappend="${active == 'students'} ? 'is-active'">
            <svg th:replace="~{fragments :: icon('users')}"></svg>
            <span class="menu-label">Ученики</span><span class="count" th:text="${navCounts['students']}"></span></a>
        <a class="menu-item" th:href="@{/tutors}" th:classappend="${active == 'tutors'} ? 'is-active'">
            <svg th:replace="~{fragments :: icon('graduation-cap')}"></svg>
            <span class="menu-label">Репетиторы</span><span class="count" th:text="${navCounts['tutors']}"></span></a>
        <a class="menu-item" th:href="@{/subjects}" th:classappend="${active == 'subjects'} ? 'is-active'">
            <svg th:replace="~{fragments :: icon('book-open')}"></svg>
            <span class="menu-label">Предметы</span><span class="count" th:text="${navCounts['subjects']}"></span></a>
        <a class="menu-item" th:href="@{/report}" th:classappend="${active == 'report'} ? 'is-active'">
            <svg th:replace="~{fragments :: icon('chart-no-axes-combined')}"></svg>
            <span class="menu-label">Отчёт</span></a>
    </nav>
    <p class="side-foot">Панель администратора. Занятия без накладок, отчёт для расчёта с репетиторами.</p>
    <div class="side-user" th:if="${currentUser}">
        <span class="avatar"><svg th:replace="~{fragments :: icon('user-round')}"></svg></span>
        <span class="side-user-name"><b th:text="${currentUser}">admin</b><small>Администратор</small></span>
        <form method="post" th:action="@{/logout}">
            <button class="btn btn-ghost" type="submit">Выйти</button>
        </form>
    </div>
</aside>

<div th:fragment="messages">
    <p class="msg msg-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <p class="msg msg-success" role="status" th:if="${success}" th:text="${success}"></p>
</div>

<!-- Icons: Lucide (https://lucide.dev), lucide-static v0.469.0, ISC license. Paths copied unchanged. -->
<svg th:fragment="icon(name)" class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
     th:switch="${name}">
    <th:block th:case="'search'"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></th:block>
    <th:block th:case="'calendar-days'"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></th:block>
    <th:block th:case="'users'"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></th:block>
    <th:block th:case="'graduation-cap'"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></th:block>
    <th:block th:case="'book-open'"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></th:block>
    <th:block th:case="'chart-no-axes-combined'"><path d="M12 16v5"/><path d="M16 14v7"/><path d="M20 10v11"/><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"/><path d="M4 18v3"/><path d="M8 14v7"/></th:block>
    <th:block th:case="'calendar-check'"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></th:block>
    <th:block th:case="'circle-check'"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></th:block>
    <th:block th:case="'user-round'"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></th:block>
    <th:block th:case="'lock'"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></th:block>
    <th:block th:case="'wallet'"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></th:block>
</svg>

</body>
</html>
