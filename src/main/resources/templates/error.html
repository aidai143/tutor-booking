<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ошибка')}"></head>
<body>
<div class="app">
    <th:block th:if="${currentUser}"><aside th:replace="~{fragments :: side('')}"></aside></th:block>

    <main class="main">
        <div class="toolbar"><h1 th:text="${status == 404} ? 'Такой страницы нет' : 'Что-то пошло не так'">Что-то пошло не так</h1></div>
        <p class="msg msg-error" th:unless="${status == 404}">Ошибка на сервере. Проверьте, запущена ли база данных.</p>
        <a class="btn btn-primary" th:href="@{/lessons}">К занятиям</a>
    </main>
</div>
</body>
</html>
