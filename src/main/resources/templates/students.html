<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ученики')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('students')}"></aside>

    <main class="main">
        <div class="toolbar"><h1>Ученики</h1></div>
        <div th:replace="~{fragments :: messages}"></div>

        <details class="new" th:open="${#lists.isEmpty(students)}">
            <summary class="btn btn-primary">Новый ученик</summary>
            <form class="new-form" method="post" th:action="@{/students}">
                <label class="field">Имя <input name="name" maxlength="100" required></label>
                <label class="field">Телефон <input name="phone" maxlength="20" placeholder="+996700123456" required></label>
                <label class="field">Класс <input name="grade" type="number" min="1" max="11" required></label>
                <div class="new-actions"><button class="btn btn-primary" type="submit">Добавить</button></div>
            </form>
        </details>

        <p class="empty" th:if="${#lists.isEmpty(students)}">Учеников пока нет.</p>
        <div class="list" role="table" aria-label="Ученики" th:unless="${#lists.isEmpty(students)}">
            <div class="row row-head cols-people" role="row">
                <span role="columnheader">Имя</span>
                <span role="columnheader">Телефон</span>
                <span role="columnheader" class="num">Класс</span>
                <span role="columnheader"></span>
            </div>
            <div class="row cols-people" role="row" th:each="s : ${students}">
                <span role="cell" th:text="${s.name}">Айдай Жуманазарова</span>
                <span role="cell" class="mono" th:text="${s.phone}">+996700123456</span>
                <span role="cell" class="mono num" th:text="${s.grade} + ' класс'">11 класс</span>
                <span role="cell" class="acts">
                    <form method="post" th:action="@{/students/{id}/delete(id=${s.id})}">
                        <button class="btn btn-ghost btn-danger" type="submit">Удалить</button>
                    </form>
                </span>
            </div>
        </div>
    </main>
</div>
</body>
</html>
