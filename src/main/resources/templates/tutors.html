<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Репетиторы')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('tutors')}"></aside>

    <main class="main">
        <div class="page-head"><h1>Репетиторы</h1></div>
        <div th:replace="~{fragments :: messages}"></div>

        <div class="layout">
            <section aria-label="Список репетиторов">
                <p class="empty" th:if="${#lists.isEmpty(tutors)}">Репетиторов пока нет.</p>
                <div class="table-wrap" th:unless="${#lists.isEmpty(tutors)}">
                    <table>
                        <thead><tr><th>Имя</th><th>Телефон</th><th class="num">Ставка</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="t : ${tutors}">
                            <td th:text="${t.name}">Гульмира</td>
                            <td th:text="${t.phone}">+996555123456</td>
                            <td class="num" th:text="${t.hourlyRateSom} + ' сом/час'">1000 сом/час</td>
                            <td class="act">
                                <form method="post" th:action="@{/tutors/{id}/delete(id=${t.id})}">
                                    <button class="btn btn-quiet btn-danger" type="submit">Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <form class="card" method="post" th:action="@{/tutors}">
                <h2 class="card-title">Новый репетитор</h2>
                <label class="field">Имя <input name="name" maxlength="100" required></label>
                <label class="field">Телефон <input name="phone" maxlength="20" placeholder="+996555123456" required></label>
                <label class="field">Ставка, сом за час <input name="hourlyRateSom" type="number" min="1" required></label>
                <button class="btn btn-primary" type="submit">Добавить</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
