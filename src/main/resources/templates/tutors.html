<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Репетиторы')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('tutors')}"></aside>

    <main class="main">
        <div class="toolbar"><h1>Репетиторы</h1></div>
        <div th:replace="~{fragments :: messages}"></div>

        <details class="new" th:open="${#lists.isEmpty(tutors)}">
            <summary class="btn btn-primary">Новый репетитор</summary>
            <form class="new-form" method="post" th:action="@{/tutors}">
                <label class="field">Имя <input name="name" maxlength="100" required></label>
                <label class="field">Телефон <input name="phone" maxlength="20" placeholder="+996555123456" required></label>
                <label class="field">Ставка, сом за час <input name="hourlyRateSom" type="number" min="1" required></label>
                <div class="new-actions"><button class="btn btn-primary" type="submit">Добавить</button></div>
            </form>
        </details>

        <p class="empty" th:if="${#lists.isEmpty(tutors)}">Репетиторов пока нет.</p>
        <div class="list" role="table" aria-label="Репетиторы" th:unless="${#lists.isEmpty(tutors)}">
            <div class="row row-head cols-people" role="row">
                <span role="columnheader">Имя</span>
                <span role="columnheader">Телефон</span>
                <span role="columnheader" class="num">Ставка</span>
                <span role="columnheader"></span>
            </div>
            <div class="row cols-people" role="row" th:each="t : ${tutors}">
                <span role="cell" th:text="${t.name}">Гульмира</span>
                <span role="cell" class="mono" th:text="${t.phone}">+996555123456</span>
                <span role="cell" class="mono num" th:text="${t.hourlyRateSom} + ' сом/ч'">1000 сом/ч</span>
                <span role="cell" class="acts">
                    <form method="post" th:action="@{/tutors/{id}/delete(id=${t.id})}">
                        <button class="btn btn-ghost btn-danger" type="submit">Удалить</button>
                    </form>
                </span>
            </div>
        </div>
    </main>
</div>
</body>
</html>
