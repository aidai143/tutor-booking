<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Предметы')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('subjects')}"></aside>

    <main class="main">
        <div class="toolbar"><h1>Предметы</h1></div>
        <div th:replace="~{fragments :: messages}"></div>

        <details class="new" th:open="${#lists.isEmpty(subjects)}">
            <summary class="btn btn-primary">Новый предмет</summary>
            <form class="new-form" method="post" th:action="@{/subjects}">
                <label class="field">Название <input name="name" maxlength="100" required></label>
                <div class="new-actions"><button class="btn btn-primary" type="submit">Добавить</button></div>
            </form>
        </details>

        <p class="empty" th:if="${#lists.isEmpty(subjects)}">Предметов пока нет.</p>
        <div class="list" role="table" aria-label="Предметы" th:unless="${#lists.isEmpty(subjects)}">
            <div class="row row-head cols-subjects" role="row">
                <span role="columnheader">Название</span>
                <span role="columnheader"></span>
            </div>
            <div class="row cols-subjects" role="row" th:each="s : ${subjects}">
                <span role="cell" th:text="${s.name}">математика</span>
                <span role="cell" class="acts">
                    <form method="post" th:action="@{/subjects/{id}/delete(id=${s.id})}">
                        <button class="btn btn-ghost btn-danger" type="submit">Удалить</button>
                    </form>
                </span>
            </div>
        </div>
    </main>
</div>
</body>
</html>
