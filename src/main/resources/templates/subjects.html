<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Предметы')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('subjects')}"></aside>

    <main class="main">
        <div class="page-head"><h1>Предметы</h1></div>
        <div th:replace="~{fragments :: messages}"></div>

        <div class="layout">
            <section aria-label="Список предметов">
                <p class="empty" th:if="${#lists.isEmpty(subjects)}">Предметов пока нет.</p>
                <div class="table-wrap" th:unless="${#lists.isEmpty(subjects)}">
                    <table>
                        <thead><tr><th>Название</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="s : ${subjects}">
                            <td th:text="${s.name}">математика</td>
                            <td class="act">
                                <form method="post" th:action="@{/subjects/{id}/delete(id=${s.id})}">
                                    <button class="btn btn-quiet btn-danger" type="submit">Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <form class="card" method="post" th:action="@{/subjects}">
                <h2 class="card-title">Новый предмет</h2>
                <label class="field">Название <input name="name" maxlength="100" required></label>
                <button class="btn btn-primary" type="submit">Добавить</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
