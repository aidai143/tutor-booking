<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Вход')}"></head>
<body>
<main class="login">
    <form class="login-card" method="post" th:action="@{/login}">
        <div class="brand">
            <span class="brand-mark"><svg th:replace="~{fragments :: icon('graduation-cap')}"></svg></span>
            <span>Учебный центр<small>расписание занятий</small></span>
        </div>
        <h1>Вход для администратора</h1>

        <p class="msg msg-error" role="alert" th:if="${param.error}">Неверный логин или пароль.</p>
        <p class="msg msg-success" role="status" th:if="${param.logout}">Вы вышли из системы.</p>

        <label class="field">Логин <input name="username" autocomplete="username" required autofocus></label>
        <label class="field">Пароль <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit">
            <svg th:replace="~{fragments :: icon('lock')}"></svg> Войти
        </button>
    </form>
</main>
</body>
</html>
