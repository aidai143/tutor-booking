spring.application.name=tutor-booking

# Read DB_USER and DB_PASSWORD from the .env file next to the project
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/tutor_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Run schema.sql on every start (it uses IF NOT EXISTS, so data is kept)
spring.sql.init.mode=always

# Keep the session id in a cookie only, never in the URL (;jsessionid=...)
server.servlet.session.tracking-modes=cookie
